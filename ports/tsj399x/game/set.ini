--------------------------------------------------------
------------金庸群侠传之系统增强版（开发版）------------
--------------------游戏配置文件------------------------
--------------------------------------------------------
--（本文件为掌机版模板：640x480 4:3 全屏；Zoom=100。
--  注意：此引擎中 Zoom 是缩放系数，填 0 会除零花屏！）
--
--启动时是否全屏  1 全屏 0 窗口
CONFIG.FullScreen=1
--------------------------------------------------------
--游戏分辨率（掌机 4:3 屏为 640x480）
CONFIG.Width = 640
CONFIG.Height = 480
--------------------------------------------------------
--设置当前所用操作系统   0:电脑	 1:安卓
CONFIG.Operation = 0
--------------------------------------------------------
--设置内存使用方式    1 多使用内存，0 少使用内存
CONFIG.LargeMemory= 1
--------------------------------------------------------
-- 是否打开声音    1 打开 0 关闭
CONFIG.EnableSound = 1
--------------------------------------------------------
--游戏中显示人物，场景等贴图的大小，100 表示正常大小
CONFIG.Zoom = 100
--------------------------------------------------------
--调整虚拟按键大小（安卓用，掌机无效）
CONFIG.KeyScale = 2400
CONFIG.ANWZ = 1
CONFIG.D1X = -1
CONFIG.D1Y = -1
CONFIG.D2X = -1
CONFIG.D2Y = -1
CONFIG.D3X = -1
CONFIG.D3Y = -1
CONFIG.D4X = -1
CONFIG.D4Y = -1
CONFIG.C1X = -1
CONFIG.C1Y = -1
CONFIG.C2X = -1
CONFIG.C2Y = -1
CONFIG.AX = -1
CONFIG.AY = -1
CONFIG.BX = -1
CONFIG.BY = -1
--------------------------------------------------------
--动态文字提示	0 关闭 1 开启
CONFIG.Remind = 0
--------------------------------------------------------
--自动存档时间（分钟） 1 - 120
CONFIG.SaveTime = 60
--------------------------------------------------------
--主角姓名
CONFIG.PlayName = "徐小侠"
--------------------------------------------------------
--给自创武功取名
CONFIG.ZCWG="天地无用"
--------------------------------------------------------
--是否启用双倍经验  0 关闭    1 开启
CONFIG.ExpLevel = 1
--------------------------------------------------------
--传送功能切换  0 编号    1 附近
CONFIG.TP = 0
--------------------------------------------------------
--MP3音乐功能 0 关闭    1 开启（无 MP3 文件时自动播放 MIDI）
CONFIG.MP3 = 1
--------------------------------------------------------
--游戏走路、动画延迟 20 - 60	数值越小反应越灵敏
CONFIG.Frame = 20
--------------------------------------------------------
--确认/取消键交换  0 否 1 是（引擎内建手柄映射：南键=确认 东键=取消）
CONFIG.SwitchABXY = 0
